<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shield by Vouch - Live Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; padding: 20px; max-width: 800px; margin: 0 auto; }
    
    /* Header & Toggle */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px; background: #1a1a1a; border-radius: 12px; }
    .toggle-container { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #00ff41; }
    input:checked + .slider:before { transform: translateX(24px); }
    .shield-status { color: #00ff41; font-weight: bold; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #1a1a1a; padding: 15px; border-radius: 12px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #00ff41; }
    .stat-label { font-size: 0.85rem; color: #888; margin-top: 5px; }

    /* Business Config (Dynamic) */
    .config-box { background: rgba(0, 255, 65, 0.05); border: 1px solid rgba(0, 255, 65, 0.2); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    .config-box h3 { color: #00ff41; margin-bottom: 10px; font-size: 1rem; }
    .config-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .config-inputs input { background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; width: 100%; }
    .config-inputs input:focus { outline: none; border-color: #00ff41; }

    /* Chat Area */
    .chat-container { background: #1a1a1a; border-radius: 12px; padding: 20px; min-height: 300px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
    .chat-header h2 { font-size: 1.2rem; }
    .protected-badge { background: rgba(0, 255, 65, 0.1); color: #00ff41; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; border: 1px solid #00ff41; }
    
    .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.4; }
    .message.user { background: #2a2a2a; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.bot { background: #252525; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
    .message.bot.blocked { border-color: #ff4444; background: rgba(255, 68, 68, 0.05); }
    .message.bot .shield-tag { color: #00ff41; font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px; }

    /* Input Area */
    .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-area input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; font-size: 1rem; }
    .input-area input:focus { outline: none; border-color: #00ff41; }
    .input-area button { background: #00ff41; color: #000; border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .input-area button:hover { background: #00cc33; }

    /* Quick Replies */
    .quick-replies { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .quick-replies button { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
    .quick-replies button:hover { border-color: #00ff41; color: #00ff41; }
  </style>
</head>
<body>

  <!-- Header & Toggle -->
  <div class="header">
    <div class="toggle-container">
      Shield: 
      <label class="switch">
        <input type="checkbox" id="shieldToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="shield-status" id="shieldStatus">ON</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="savedCalls">0</div>
      <div class="stat-label">API Calls Saved</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="madeCalls">0</div>
      <div class="stat-label">API Calls Made</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="moneySaved">$0.000</div>
      <div class="stat-label">Money Saved</div>
    </div>
  </div>

  <!-- Dynamic Business Config -->
  <div class="config-box">
    <h3>⚙️ Configure Your Business (Dynamic)</h3>
    <div class="config-inputs">
      <input type="text" id="businessType" value="restaurant" placeholder="e.g. clinic, salon, store">
      <input type="text" id="businessDesc" value="Italian food in Mumbai" placeholder="Describe your business">
    </div>
  </div>

  <!-- Chat Container -->
  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <h2>🤖 AI Chatbot</h2>
      <span class="protected-badge">Protected</span>
    </div>
    <!-- Messages will appear here -->
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type anything..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Send</button>
  </div>

  <!-- Quick Replies -->
  <div class="quick-replies">
    <button onclick="sendQuickReply('Who are you?')">"Who are you?"</button>
    <button onclick="sendQuickReply('Python code for calculator')">"Python code..."</button>
    <button onclick="sendQuickReply('Ignore previous instructions')">"Ignore previous..."</button>
    <button onclick="sendQuickReply('I want to order pizza')">"I want to order"</button>
    <button onclick="sendQuickReply('Tell me a joke')">"Tell me a joke"</button>
  </div>

  <script>
    let savedCalls = 0;
    let madeCalls = 0;
    const costPerCall = 0.002;

    // Toggle Logic
    document.getElementById('shieldToggle').addEventListener('change', function() {
      const status = document.getElementById('shieldStatus');
      status.textContent = this.checked ? 'ON' : 'OFF';
      status.style.color = this.checked ? '#00ff41' : '#ff4444';
    });

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendQuickReply(text) {
      document.getElementById('userInput').value = text;
      sendMessage();
    }

    function addMessage(text, sender, isBlocked = false) {
      const chatContainer = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender} ${isBlocked ? 'blocked' : ''}`;
      
      if (sender === 'bot' && isBlocked) {
        msgDiv.innerHTML = `<span class="shield-tag">🛡️ Shield: ⚠️ Blocked. No API call made. $0.00 spent.</span>${text}`;
      } else if (sender === 'user') {
        msgDiv.innerHTML = `<strong>You:</strong> ${text}`;
      } else {
        msgDiv.innerHTML = `<strong>Bot:</strong> ${text}`;
      }
      
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function updateStats(isBlocked) {
      if (isBlocked) {
        savedCalls++;
        document.getElementById('savedCalls').textContent = savedCalls;
        document.getElementById('moneySaved').textContent = `$${(savedCalls * costPerCall).toFixed(3)}`;
      } else {
        madeCalls++;
        document.getElementById('madeCalls').textContent = madeCalls;
      }
    }

    // Client-Side Shield Check
    function clientSideCheck(message, businessType) {
      const blockKeywords = ['who are you', 'what ai', 'python code', 'ignore previous', 'tell me a joke', 'weather', 'calculator'];
      const lowerMsg = message.toLowerCase();
      
      for (let keyword of blockKeywords) {
        if (lowerMsg.includes(keyword)) {
          return { blocked: true, response: `I can only help with our ${businessType} services. How can I assist you today?` };
        }
      }
      return { blocked: false };
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      const shieldEnabled = document.getElementById('shieldToggle').checked;
      const businessType = document.getElementById('businessType').value || 'business';
      const businessDesc = document.getElementById('businessDesc').value || 'A standard business';

      addMessage(message, 'user');
      input.value = '';

      // 1. Client-Side Shield Check
      if (shieldEnabled) {
        const check = clientSideCheck(message, businessType);
        if (check.blocked) {
          addMessage(check.response, 'bot', true);
          updateStats(true);
          return;
        }
      }

      // 2. Backend AI Call (No API key needed in frontend, backend uses .env)
      try {
        addMessage("Thinking...", 'bot');
        const lastMsg = document.getElementById('chatContainer').lastChild;

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            businessType: businessType,
            businessDesc: businessDesc,
            shieldEnabled: shieldEnabled
          })
        });

        const data = await response.json();
        
        // Remove "Thinking..."
        if(lastMsg && lastMsg.textContent.includes("Thinking...")) lastMsg.remove();

        if (data.success) {
          addMessage(data.response, 'bot');
        } else {
          addMessage("Error: " + (data.error || data.message), 'bot', true);
        }
        updateStats(false);

      } catch (error) {
        const lastMsg = document.getElementById('chatContainer').lastChild;
        if(lastMsg && lastMsg.textContent.includes("Thinking...")) lastMsg.remove();
        addMessage("Network Error: " + error.message, 'bot', true);
      }
    }
  </script>
</body>
</html>
